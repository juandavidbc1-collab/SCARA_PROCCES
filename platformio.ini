; Firmware SCARA (tarjeta v5) - ESP32-DevKitC WROOM-32 con ESP-IDF
; Compilar y cargar:  PlatformIO > Upload  (o:  pio run -t upload)
; NO abras el monitor serie de PlatformIO al mismo tiempo que tools/teleop.py: el puerto COM es de uno solo.

[env:esp32dev]
platform = espressif32@6.9.0        ; trae ESP-IDF 5.3
board = esp32dev
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; upload_port = COM5                ; descomenta y pon tu puerto si no lo detecta solo
; monitor_port = COM5
