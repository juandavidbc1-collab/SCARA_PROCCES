# PROCESO ASIGNADO: pasar por los 4 huecos de las 4 PCB, en una fila recta frente al robot.
#
# En cada hueco: mover el brazo -> subir el servo (baja el tornillo) -> bajar M3 -> bajar el servo (baja el destornillador)
# -> subir M3 1/4 de la barra -> servo a 0. Al terminar, el brazo va a 0 0.
# Antes de iniciar: buscar el tope de M3 y hacer Home. El panel deja elegir una sola PCB.
#
# Las coordenadas son en cm desde el eje de J1: +x es el brazo recto y +y es la izquierda.
# Si el brazo no alcanza un hueco, el archivo se rechaza al cargarlo y dice cuál.

repeticiones: 1           # 0 = repite hasta que lo detengas

proceso:
  base_cm: [0, 0]
  codo: -1                # El mismo con el que se calibró el robot
  placas_cm:              # Centro de cada placa; lados paralelos a los ejes y 30 mm entre placas
    A: [17, 10.2]
    B: [17, 3.4]
    C: [17, -3.4]
    D: [17, -10.2]
  lado_mm: 38
  hueco_borde_mm: 3.5
  asentar_s: 0.3          # Espera al llegar y al terminar de bajar M3
  servo: {arriba_s: 1.0, bajar_s: 1.0}   # Tiempo para que el servo llegue y el tornillo termine de caer
  # Vueltas desde el tope de arriba: 24,855 son 100 mm (de 106 a 6 mm de altura); 18,641 dejan M3 a 31 mm.
  m3: {abajo_vueltas: 24.855, trabajo_vueltas: 18.641}
